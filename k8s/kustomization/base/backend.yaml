apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8000"
        prometheus.io/path: "/metrics"
    spec:
      containers:
      - name: backend
        image: backend:latest
        imagePullPolicy: IfNotPresent
        resources:
          requests:
            cpu: "100m"
            memory: "128Mi"
          limits:
            cpu: "200m"
            memory: "256Mi"
        ports:
        - containerPort: 8000
        env:
        - name: DB_HOST
          valueFrom:
            configMapKeyRef:
              name: synq-config
              key: DB_HOST
        - name: DB_PORT
          valueFrom:
            secretKeyRef:
              name: synq-secrets
              key: DB_PORT
        - name: DB_NAME
          valueFrom:
            secretKeyRef:
              name: synq-secrets
              key: DB_NAME
        - name: DB_USER
          valueFrom:
            secretKeyRef:
              name: synq-secrets
              key: DB_USER
        - name: DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: synq-secrets
              key: DB_PASSWORD
        - name: SECRET
          valueFrom:
            secretKeyRef:
              name: synq-secrets
              key: SECRET
        - name: ALGORITHM
          valueFrom:
            secretKeyRef:
              name: synq-secrets
              key: ALGORITHM
        - name: API_PREFIX
          valueFrom:
            configMapKeyRef:
              name: synq-config
              key: API_PREFIX
        - name: ENABLE_METRICS
          valueFrom:
            configMapKeyRef:
              name: synq-config
              key: ENABLE_METRICS
        - name: EMAIL_LOGIN
          valueFrom:
            secretKeyRef:
              name: synq-secrets
              key: EMAIL_LOGIN
        - name: EMAIL_PASSWORD
          valueFrom:
            secretKeyRef:
              name: synq-secrets
              key: EMAIL_PASSWORD
        - name: SMTP_HOST
          valueFrom:
            secretKeyRef:
              name: synq-secrets
              key: SMTP_HOST
        - name: SMTP_PORT
          valueFrom:
            secretKeyRef:
              name: synq-secrets
              key: SMTP_PORT
        - name: CODE_EXPIRES_IN
          valueFrom:
            secretKeyRef:
              name: synq-secrets
              key: CODE_EXPIRES_IN
        - name: REDIS_HOST
          valueFrom:
            secretKeyRef:
              name: synq-secrets
              key: REDIS_HOST
        - name: REDIS_PORT
          valueFrom:
            secretKeyRef:
              name: synq-secrets
              key: REDIS_PORT
        - name: OTEL_EXPORTER_OTLP_ENDPOINT
          value: "http://tempo.monitoring.svc.cluster.local:4317"
---
apiVersion: v1
kind: Service
metadata:
  name: backend-service
spec:
  selector:
    app: backend
  ports:
  - port: 8000
    targetPort: 8000
  type: LoadBalancer
