apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-provisioning
  namespace: monitoring
data:
  datasources.yaml: |
    apiVersion: 1
    datasources:
      - name: Prometheus
        type: prometheus
        url: http://prometheus-service.monitoring.svc.cluster.local:9090
        isDefault: true
      - name: Tempo
        type: tempo
        url: http://tempo.monitoring.svc.cluster.local:3200
        jsonData:
          httpMethod: GET
          serviceMap:
            datasourceUid: 'prometheus'
  dashboard-provider.yaml: |
    apiVersion: 1
    providers:
      - name: 'Synq'
        orgId: 1
        folder: ''
        type: file
        disableDeletion: false
        editable: true
        options:
          path: /etc/grafana/provisioning/dashboards
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboards
  namespace: monitoring
data:
  synq-dashboard.json: |
    {
      "id": null,
      "title": "Synq Backend Dashboard",
      "panels": [
        {
          "title": "HTTP Request Rate",
          "type": "timeseries",
          "targets": [{"expr": "rate(http_request_duration_seconds_count[1m])"}]
        },
        {
          "title": "Total Registrations",
          "type": "timeseries",
          "targets": [{"expr": "synq_registrations_total"}]
        }
      ]
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: grafana
  namespace: monitoring
spec:
  replicas: 1
  selector:
    matchLabels:
      app: grafana
  template:
    metadata:
      labels:
        app: grafana
    spec:
      containers:
      - name: grafana
        image: grafana/grafana:10.4.2
        ports:
        - containerPort: 3000
        env:
        - name: GF_AUTH_ANONYMOUS_ENABLED
          value: "true"
        - name: GF_AUTH_ANONYMOUS_ORG_ROLE
          value: "Admin"
        volumeMounts:
        - name: provisioning-ds
          mountPath: /etc/grafana/provisioning/datasources/datasources.yaml
          subPath: datasources.yaml
        - name: provisioning-db
          mountPath: /etc/grafana/provisioning/dashboards/provider.yaml
          subPath: dashboard-provider.yaml
        - name: dashboards
          mountPath: /etc/grafana/provisioning/dashboards/synq-dashboard.json
          subPath: synq-dashboard.json
      volumes:
      - name: provisioning-ds
        configMap:
          name: grafana-provisioning
      - name: provisioning-db
        configMap:
          name: grafana-provisioning
      - name: dashboards
        configMap:
          name: grafana-dashboards
---
apiVersion: v1
kind: Service
metadata:
  name: grafana-service
  namespace: monitoring
spec:
  selector:
    app: grafana
  ports:
  - port: 3000
    targetPort: 3000
  type: LoadBalancer
