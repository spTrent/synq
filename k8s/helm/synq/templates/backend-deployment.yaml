apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "synq.fullname" . }}-backend
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      containers:
      - name: backend
        image: {{ .Values.backend.image }}
        env:
        - name: DB_HOST
          value: {{ .Values.backend.dbHost }}
        - name: DB_NAME
          value: {{ .Values.backend.dbName }}
        - name: DB_USER
          value: {{ .Values.backend.dbUser }}
        - name: DB_PASSWORD
          value: {{ .Values.backend.dbPassword }}
        - name: REDIS_HOST
          value: {{ .Values.backend.redisHost }}
